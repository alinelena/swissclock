name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Install system dependencies for Qt
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0

    - name: Install tox and tox-uv
      run: uv pip install --system tox tox-uv

    - name: Run Tests
      # xvfb-run creates a virtual X server so PySide6 can run headlessly
      run: |
        TOX_ENV="py$(echo ${{ matrix.python-version }} | tr -d '.')"
        QT_DEBUG_PLUGINS=1 xvfb-run -a tox -e $TOX_ENV

    - name: Coveralls
      uses: coverallsapp/github-action@v2
      with:
        file: coverage.xml
        flag-name: run-${{ matrix.python-version }}
        parallel: true

  coveralls_finish:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls Finished
      uses: coverallsapp/github-action@v2
      with:
        parallel-finished: true
