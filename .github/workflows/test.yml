name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      
    - name: Install system dependencies for Qt
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libegl1 libxkbcommon-x11-0 libxcb-cursor0
        
    - name: Install tox and tox-uv
      run: uv pip install --system tox tox-uv
      
    - name: Run Tests
      # xvfb-run creates a virtual X server so PySide6 can run headlessly
      run: xvfb-run -a tox
